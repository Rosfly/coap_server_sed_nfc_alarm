CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_JSON_LIBRARY=y

# Logging - disabled for battery deployment
# Use prj_uart.conf overlay for USB debugging
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# Console and UART - disabled for battery-only boot
# Use prj_uart.conf overlay for USB debugging
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Kernel options
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
# System workqueue needs larger stack for OpenThread API calls (NFC commissioning)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Shell disabled for battery deployment (no UART backend)
# Enable via prj_uart.conf overlay for debugging
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_NET_SHELL=n

# OpenThread logging disabled for battery deployment
CONFIG_OPENTHREAD_DEBUG=n

# Maximum TX power for better range (nRF54L15 supports up to +8 dBm)
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8

# NVS for persistent storage
# Note: CONFIG_SETTINGS is auto-enabled by OpenThread when CONFIG_FLASH=y
CONFIG_NVS=y

# Sensor support for temperature updates (required by nRF 802.15.4 radio)
CONFIG_SENSOR=y

# ADC support for battery voltage measurement
CONFIG_ADC=y

# Thread auto-start on boot (uses dataset stored in NVS)
CONFIG_OPENTHREAD_MANUAL_START=n

# Configure as MTD (Minimal Thread Device / Child) instead of FTD (Router)
# This makes the device act as an end device that attaches to routers
# Better for battery-powered or mobile devices that may lose connection
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n

# MTD-specific optimizations for mobile devices
# Child timeout: time before parent removes this device (240s = 4 minutes)
CONFIG_OPENTHREAD_MLE_CHILD_TIMEOUT=240

# ============================================
# SED (Sleepy End Device) Configuration
# ============================================
# Enable SED mode - radio sleeps between polls for significant power savings
# Device wakes on: 1) poll timer (every 60s), 2) button GPIO interrupt
CONFIG_OPENTHREAD_MTD_SED=y

# Poll period: Wake every 15 seconds to receive queued CoAP requests
# NOTE: OTBR indirect TX timeout is ~7-15s, so 60s poll period causes message loss
# 15s ensures device polls before queued messages expire at OTBR
CONFIG_OPENTHREAD_POLL_PERIOD=5000

# Child supervision (recommended for SED reliability)
# Parent sends supervision frame if no traffic within interval
CONFIG_OPENTHREAD_CHILD_SUPERVISION_INTERVAL=129
# Child checks for supervision within this timeout
CONFIG_OPENTHREAD_CHILD_SUPERVISION_CHECK_TIMEOUT=190

# ============================================
# NFC Commissioning Configuration
# ============================================
# Enable NFC-based Thread dataset provisioning
# Device waits for dataset via NFC if not already commissioned
CONFIG_OT_COAP_NFC_COMMISSION=y

# NFC Type 4 Tag support (read-write mode for phone interaction)
CONFIG_NFC_T4T_NRFXLIB=y

# NDEF message support for parsing phone-written data
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_PARSER=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_TEXT_RECORD=y

# NFC threading configuration
CONFIG_NFC_THREAD_CALLBACK=y

# NDEF file size (Thread dataset max 254 bytes = 508 hex chars + overhead)
CONFIG_NDEF_FILE_SIZE=512

# Flash write support for NFC (if storing NDEF persistently)
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
