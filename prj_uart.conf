#
# USB Debugging Overlay - Use when connected via USB for development
# Build: west build -p always -b xiao_nrf54l15/nrf54l15/cpuapp -- -DOVERLAY_CONFIG="prj_uart.conf"

# Enable UART for USB debugging
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Enable logging via UART
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Enable shell for debugging (OpenThread CLI)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y

# Shell stack needs to be large enough for OpenThread dataset parsing
# Default 3168 is too small for "ot dataset set active <long hex>"
CONFIG_SHELL_STACK_SIZE=4096

# Disable NFC commissioning in debug build - use shell instead
# NFC T4T emulation conflicts with shell dataset commands
CONFIG_OT_COAP_NFC_COMMISSION=n
